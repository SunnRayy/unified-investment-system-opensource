# ---------------------------------------------------------------------------
# Generation invariants (asserted by generate.py after writing)
# ---------------------------------------------------------------------------
invariants:
  - "computed 合计 columns equal the sum of their leaf columns (role summation)"
  - "RSU vest amounts in 收入_主动收入_RSU_USD reconcile with RSU_transactions.xlsx vest rows"
  - "投资理财_股票基金_Schawab_USD months reconcile with Schwab Wire Transfer rows"
  - "gold grams in 投资资产_黄金_纸黄金(克) equal cumulative Gold_transactions net grams"
  - "IBKR EOS row counts and section totals recomputed from emitted rows"
  - "every required_types / required_actions vocabulary value appears at least once"
  - "all files byte-identical across two runs with the same rng_seed"

# ---------------------------------------------------------------------------
# Fixture-only fund codes — NOT emitted into any demo workbook.
# ---------------------------------------------------------------------------
# The test suite needs distinct fund identifiers in far more combinations than
# the five-fund catalog above provides. These 9000xx codes are fictional and
# exist purely so tests have arbitrary-but-stable ids to assert on.
#
# They are declared HERE, rather than invented ad hoc in each test, because
# tools/release/leak_gate.py derives its allowlist from this file: any
# six-digit fund code that is not the persona's own is presumed real and fails
# the gate. Adding a fixture id anywhere else would trip that guard — which is
# exactly the behaviour we want, since the guard is what the 2026-08-29 leak
# investigation showed had been disarmed by over-broad triage rather than
# missing. generate.py reads only the keys it knows (cn_funds, schwab, ibkr,
# …), so this block is inert for demo-data generation.
fixture_codes:
  - {code: "900001", name: "示例沪深300指数增强A"}
  - {code: "900002", name: "示例新兴产业股票"}
  - {code: "900003", name: "示例主题混合A"}
  - {code: "900004", name: "示例价值精选混合"}
  - {code: "900005", name: "示例稳健货币B"}
  - {code: "900006", name: "示例聚财货币B"}
  - {code: "900007", name: "示例现金管理货币C"}
  - {code: "900008", name: "示例中证500ETF联接A"}
  - {code: "900009", name: "示例科技ETF联接A"}
  - {code: "900010", name: "示例生物科技ETF联接A"}
  - {code: "900011", name: "示例红利低波ETF联接A"}
  - {code: "900012", name: "示例中证红利指数增强A"}
  - {code: "900013", name: "示例消费行业股票"}
  - {code: "900014", name: "示例新兴成长混合A"}
  - {code: "900015", name: "示例纳斯达克100ETF联接A"}
