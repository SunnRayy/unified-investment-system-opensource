# =============================================================================
# Huinsight demo persona — "the example household"
# =============================================================================
# Single source of truth for ALL synthetic data in this project:
#   - tests/fixtures/readers/*        (generated by tools/demo_data/generate.py)
#   - seeds/example/                  (WS-3 seed pack — mapping keys come from
#                                      the column names declared here)
#   - the quickstart demo dataset and README screenshots
#
# Everything below is fictional. The household is deliberately implausible to
# confuse with any real person: placeholder names, round-ish values, and a net
# worth target of ~¥3.5M chosen for readable dashboards.
#
# Structure mirrors the shapes the 7 readers consume (sheet names, column
# names, section layouts). Chinese structural labels (bank names, expense
# categories) are part of the product's example schema — they are intentionally
# identical to the reader configs in config/readers/*.yaml and the mapping
# seeds, so the full mapping pipeline is exercised end-to-end.
#
# Determinism: generate.py must derive every value from `rng_seed` — two runs
# produce byte-identical files.

version: 1
rng_seed: 42

identity:
  name_en: "Xiaoming Wang"          # IBKR ACCT section Name field
  name_zh: "王小明"                  # insurance 被保险人 / 家庭成员
  ibkr_account: "U0000123"
  schwab_account_tail: "342"        # masks as XXX342; filename Individual_XXX342_...
  base_currency: CNY

timeline:
  start_month: 2024-07              # 24 monthly rows in FS sheets
  end_month: 2026-06
  snapshot_date: 2026-05-23         # Schwab positions file date (filename kept)
  ibkr_report_dates: [2026-06-12, 2026-07-17]   # the two flex fixtures
  usd_cny: 7.10                     # 参考_美元汇率 reference series midpoint
  gold_cny_per_gram: 760.0          # 参考_黄金价格_克价 midpoint

targets:
  net_worth_cny: 3500000            # ± generator noise; used by acceptance tests
  monthly_salary_cny: 32000
  monthly_essential_spend_cny: [9000, 14000]     # uniform range
  monthly_discretionary_spend_cny: [2000, 8000]

# ---------------------------------------------------------------------------
# Schwab (CSV) — Individual-Positions-*.csv + Individual_XXX342_Transactions_*.csv
# ---------------------------------------------------------------------------
schwab:
  positions:                        # deliberately NOT the owner's mix
    - {symbol: VOO,  description: "VANGUARD S&P 500 ETF",            qty: 40,  cost_usd: 16800, type: "ETFs & Closed End Funds"}
    - {symbol: QQQ,  description: "INVESCO QQQ TRUST",               qty: 15,  cost_usd: 6100,  type: "ETFs & Closed End Funds"}
    - {symbol: SCHD, description: "SCHWAB US DIVIDEND EQUITY ETF",   qty: 100, cost_usd: 7600,  type: "ETFs & Closed End Funds"}
    - {symbol: AAPL, description: "APPLE INC",                       qty: 25,  cost_usd: 4200,  type: "Equity"}
    - {symbol: "BRK/B", description: "BERKSHIRE HATHAWAY CLASS B",   qty: 6,   cost_usd: 2300,  type: "Equity"}   # exercises symbol_norm BRK/B→BRK-B
    - {symbol: BND,  description: "VANGUARD TOTAL BOND MARKET ETF",  qty: 30,  cost_usd: 2150,  type: "ETFs & Closed End Funds"}
  cash_usd: 850.50
  transactions:
    months_of_history: 18
    # generator must emit at least one row per action to cover the action_map
    # vocabulary (SCHWAB_ACTION_MAPPING_SEED), including:
    required_actions: [Buy, Sell, "Cash Dividend", "Qualified Dividend",
                       "NRA Tax Adj", "Reinvest Dividend", "Reinvest Shares",
                       "Credit Interest", "Wire Transfer", "Journal",
                       "Security Transfer"]           # both signs (in + out)
    required_symbols: [BRKB]        # bare compound ticker → symbol_norm path

# ---------------------------------------------------------------------------
# IBKR (Flex CSV) — ibkr/IBKR_UIS_Report.csv + ibkr_trades/IBKR_UIS_Report_trades.csv
# ---------------------------------------------------------------------------
ibkr:
  positions:
    - {symbol: VTI, description: "VANGUARD TOTAL STOCK MARKET ETF", qty: 30, cost_usd: 7300}
    - {symbol: IEFA, description: "ISHARES CORE MSCI EAFE ETF",     qty: 60, cost_usd: 4300}
  cash_usd: 1000.00
  trades:                            # trades fixture variant (TRNT section)
    - {symbol: VTI,  side: BUY,  qty: 10}
    - {symbol: IEFA, side: SELL, qty: -15}
  transfers:                         # TRFR section rows (ACAT-style)
    count: 3

# ---------------------------------------------------------------------------
# CN funds (Excel) — funding_transactions.xlsx
# ---------------------------------------------------------------------------
cn_funds:
  catalog:                           # public fund codes, not the owner's set
    - {code: "110020", name: "易方达沪深300ETF联接A",  type: "指数型"}
    - {code: "161725", name: "招商中证白酒指数A",      type: "指数型"}
    - {code: "005827", name: "易方达蓝筹精选混合",     type: "混合型"}
    - {code: "519674", name: "银河创新成长混合A",      type: "混合型"}
    - {code: "000198", name: "天弘余额宝货币A",        type: "货币型"}
  linked_banks:                      # 关联银行卡 values (bank + fake card tail)
    - {bank: "招商银行", card_tail: "1234"}
    - {bank: "建设银行", card_tail: "5678"}

  transactions:
    months_of_history: 24
    approx_rows: 200                 # real file has ~2,400; shape not volume
    required_types: ["申购", "赎回", "卖基金", "超级转换份额调减", "现金分红", "快速取现", "活期宝即充即用"]  # full CN_FUND_TYPE_MAP_SEED vocab coverage (WS-1.5: reader_mappings DB-override tests need these two present) + generator adds one unmapped value for the other-fallback
  holdings_summary_rows: 12          # 基金持仓汇总 (latest snapshot per fund + history)

# ---------------------------------------------------------------------------
# Gold (Excel) — Gold_transactions.xlsx
# ---------------------------------------------------------------------------
gold:
  holdings:
    - {asset: "纸黄金", account: "招行", grams: 120}
    - {asset: "纸黄金", account: "建行", grams: 40}    # 建行→CCB exercises a different id_field_map key than the owner's data ever did
  transactions:
    approx_rows: 20
    required_types: ["买入", "卖出", "结息"]

# ---------------------------------------------------------------------------
# Insurance (Excel) — Insurance_Portfolio.xlsx
# ---------------------------------------------------------------------------
insurance:
  policies:
    - {product: "安泰终身寿险2019(终身寿+重疾)", insurer: "平安人寿",
       type: "综合(寿险+重疾)", start: 2019-05-20, annual_premium_cny: 8400,
       coverage_cny: 500000, status: "有效"}
    - {product: "惠民定期重疾", insurer: "人保健康",
       type: "定期重疾", start: 2021-03-10, annual_premium_cny: 1800,
       coverage_cny: 300000, status: "有效"}
    - {product: "旧意外险(已退保)", insurer: "平安人寿",
       type: "意外险", start: 2018-01-15, annual_premium_cny: 900,
       coverage_cny: 200000, status: "退保"}          # exercises the 保单状态 ne-退保 filter
  premium_record_columns: ["安泰人生", "公司团险", "互联网保险"]   # 保费记录 wide melt
  insured: "王小明"

# ---------------------------------------------------------------------------
# RSU (Excel) — RSU_transactions.xlsx
# ---------------------------------------------------------------------------
rsu:
  # "Amazon RSU" is kept as the employer grant label: it keys the shipped
  # rsu.yaml id_field_maps ("Amazon RSU" → RSU_AMZN) and the FS reference
  # column 参考_Amazon Stock Price. An employer name is product schema, not
  # personal data. Generalizing the RSU subsystem is roadmap work (WS-2+).
  asset_name: "Amazon RSU"
  vest_schedule:
    start: 2024-02-15
    cadence: quarterly
    shares_per_vest: 12
    sell_to_cover_shares: 4          # each vest is followed by a Sell row
  price_usd_range: [150, 220]        # deterministic walk within range
  approx_rows: 20                    # 10 quarterly cycles × (vest + sell-to-cover); schedule fields are authoritative, this is derived

# ---------------------------------------------------------------------------
